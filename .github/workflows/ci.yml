name: CI

on:
  # Branch flow (CONTRIBUTING.md): feature/* -> develop -> staging -> main, then a v* tag on main.
  push:
    branches: [develop, staging, main]
  pull_request:
  # The release workflow runs these same checks before building anything.
  workflow_call:

# Read-only token: nothing in CI writes to the repository.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); Dependabot (.github/dependabot.yml) proposes updates.
# The rust-toolchain action is pinned to a commit on its `1.99.1` branch (that branch installs exactly
# that Rust); rust-toolchain.toml names the same version for local builds (a step checks the comments).

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions are pinned to commit SHAs
        run: |
          if grep -rnE '^[[:space:]-]*uses:' .github/workflows \
              | grep -vE 'uses:[[:space:]]*\./|@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "::error::Pin every action above to a full 40-character commit SHA."
            exit 1
          fi
      - name: CI and rust-toolchain.toml name the same Rust version
        run: |
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          for f in .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/perf.yml; do
            # the action is pinned to a commit on its version branch; the comment names that version
            if grep -E '^[[:space:]]*- uses: dtolnay/rust-toolchain@' "$f" | grep -vqF "# rust ${pinned} (its version branch)"; then
              echo "::error::$f installs a Rust version other than rust-toolchain.toml ($pinned)."
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # rust 1.99.1 (its version branch)
      - name: Engine tests
        run: cargo test --locked -p sketchcraft-core
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # no install scripts: nothing in the app's dependencies needs to run code on install
      - name: App dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Vendored Opal is the exact files we checked in
        working-directory: app/public/ruby
        run: sha256sum -c SHA256SUMS
      - name: App type check
        working-directory: app
        run: npx tsc --noEmit
      - name: App checks (skin values, plugin sandbox lockdown, plugin data)
        working-directory: app
        run: npm run check
      - name: App unit tests (Vitest)
        working-directory: app
        run: npm test

  # The browser suites (tools/ui-tests, tools/security-tests, tools/ruby-tests) against the real engine: a release
  # bridge plus the Vite dev page on a throwaway model, driven by Playwright's Chromium. No secrets, read-only token.
  # Playwright is not an app dependency: it is installed here, at a pinned version, into a folder outside the
  # repository (SKETCHCRAFT_PLAYWRIGHT; tools/demos/lib.mjs looks there). Its browser download is not cached:
  # a cache entry is writable by any workflow run on the repository, and the download is about a minute.
  #
  # The full browser suite gates release candidates: it runs on staging and main (pushes and PRs into them)
  # and on release tags (release.yml calls this workflow). develop and feature PRs get the fast jobs only.
  #
  # The suites are split into three fixed, balanced groups that run in parallel (`run.mjs --shard=i/3`; one runner
  # took more than 30 minutes). `ui-tests` below is the check the rulesets require: it reports the three together.
  ui-suites:
    name: ui-suites (${{ matrix.shard }}/3)
    if: >-
      github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.base_ref == 'staging' || github.base_ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # rust 1.99.1 (its version branch)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Release engine
        run: cargo build --release --locked -p sketchcraft-core
      - name: App dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Playwright and its Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts --no-audit --no-fund "playwright-core@${PLAYWRIGHT_VERSION}"
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium
          echo "SKETCHCRAFT_PLAYWRIGHT=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Browser suites
        env:
          SKETCHCRAFT_TRACE_DIR: ${{ runner.temp }}/ui-traces
          SHOT_DIR: ${{ runner.temp }}/ui-shots
        run: node tools/ui-tests/run.mjs --shard=${{ matrix.shard }}/3
      # what the visual suite saw, when this platform has no reference pictures yet (tools/ui-tests/visual.mjs)
      - name: Keep the visual candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-candidates-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-shots/visual/candidates
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the screenshots and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ui-traces
            ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  # The one check the rulesets require for the browser suites: green only when all three groups are
  ui-tests:
    needs: ui-suites
    if: >-
      always() && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: All three groups of browser suites passed
        env:
          RESULT: ${{ needs.ui-suites.result }}
        run: |
          echo "browser suites: $RESULT"
          [ "$RESULT" = "success" ]

  # (The scale-figure generator's `--check` is not run here: its sine and cosine come out a last digit
  # different on Linux than on a Mac for four of the figures, so the check is only stable on the machine
  # that made the files. Run `python3 tools/scale_figures/scale_figures.py --check` before changing them.)

  # Light dependency check, no secrets and nothing installed beyond what the app already has: the
  # shipped npm packages have no known high advisory, and no lockfile takes code from anywhere but
  # the crates.io / npm registries. (`cargo audit` isn't run here: it would mean installing an
  # unpinned tool in CI; run it by hand before a release.)
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lockfiles only name the public registries
        run: |
          if grep -h '"resolved"' app/package-lock.json tools/release/package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "::error::a package comes from somewhere other than registry.npmjs.org"; exit 1
          fi
          if grep -n '^source = ' Cargo.lock | grep -v 'registry+https://github.com/rust-lang/crates.io-index'; then
            echo "::error::a crate comes from somewhere other than crates.io"; exit 1
          fi
      - name: No high advisory in the packages the app ships
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

  # Release candidates move one way: develop -> staging -> main. A PR into staging must come from develop,
  # and a PR into main from staging, both in this repository. (Rulesets require this check on those branches.)
  flow:
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: The PR comes from the branch before this one
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$BASE" in
            staging) want=develop ;;
            main) want=staging ;;
          esac
          if [ "$HEAD" != "$want" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::A PR into $BASE has to come from $want in this repository (this one is from $HEAD_REPO:$HEAD). Open feature PRs against develop."
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"
