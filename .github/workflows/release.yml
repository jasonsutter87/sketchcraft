# Push a tag like v0.2.0 to build SketchCraft for macOS, Windows and Linux (x64 and arm64)
# and attach the installers (plus the headless CLI, the portable ZIP and
# SHA-256 checksums) to a DRAFT GitHub release. Nothing is public until you
# review it and click "Publish release".
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the jobs that put files on the draft release get
# write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); Dependabot (.github/dependabot.yml) proposes updates.
#
# How the update-signing key is kept away from npm code:
#   - The web UI is built in its own job (`frontend`), which has no secrets.
#     The installer jobs download that build instead of running
#     `npm run build`: tauri's beforeBuildCommand is switched off for them
#     with a --config override.
#   - Installer jobs install npm packages with --ignore-scripts, so no
#     package install script runs there.
#   - Apple signing secrets are Environment secrets of `release`, given only to steps of the
#     `sign-macos` job, which names that environment (so it waits for the reviewer), compiles
#     nothing and checks out no code (Apple's own tools sign and notarize the app the `build`
#     job made). The yes/no switch is the repository variable APPLE_SIGNING, not a secret.
#   - Compiling is separate from signing. The `build` job compiles with
#     `cargo build --locked` semantics (`-- --locked`) and holds no secrets and
#     a read-only token. The
#     `publish` job signs the update packages with the real key and makes the
#     draft release; it compiles nothing, so no dependency build script or
#     proc-macro ever runs next to the key. Only the pinned Tauri CLI
#     (`signer sign`, installed alone from tools/release/package-lock.json with --ignore-scripts)
#     and short scripts run there; each platform's files are downloaded into their own folder and
#     checked against that platform's exact names and file types (tools/release/check-bundles.mjs)
#     before anything is signed.
# The `publish` job names a GitHub Environment, `release`: put the signing
# secrets in it with required reviewers, and add a tag protection rule
# (ruleset) for v* tags so only the maintainer can start a release
# (docs/SIGNING.md). Those are repository settings only the owner can turn on.

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # A release is a v* tag on a commit that's on main, and it names the app's own version.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the app version, and the commit is on main
        run: |
          app=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app version ${app}."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} isn't on main. Releases are cut from main."
            exit 1
          fi
      # Update-key rotation (docs/SIGNING.md, "Key rotation (0.3.6 bridge)"): v0.3.6 takes the bridge path
      # (signed with the OLD key), anything greater the post-bridge path (NEW key, plus the frozen bridge
      # file). A path that can't be taken fails here, before anything is built.
      - name: Which update-key path, and can it be taken
        run: node tools/release/preflight.mjs .

  # The web UI, built once without any secrets. The installers embed it.
  frontend:
    needs: [checks, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  # Says whether Apple signing is switched on, and nothing else. It checks out no code and runs
  # nothing but one `echo`, and it names no secret at all: the switch is the repository VARIABLE
  # `APPLE_SIGNING` (set it to `true`; Settings > Secrets and variables > Actions > Variables), because the
  # Apple secrets live in the `release` Environment, which only `sign-macos` (after its reviewer approves) can read.
  apple-check:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_APPLE: ${{ vars.APPLE_SIGNING == 'true' }}
    outputs:
      has_apple: ${{ steps.apple.outputs.has_apple }}
    steps:
      - id: apple
        shell: bash
        run: echo "has_apple=${HAS_APPLE}" >> "$GITHUB_OUTPUT"

  # Compiles and bundles the installers. This job has NO secrets: every Rust
  # build script, proc-macro and npm package runs here without the update-signing
  # key and without a token that can write to the repository. (The update
  # packages it makes are signed with a throwaway key made fresh for the run;
  # the `publish` job signs them for real.)
  build:
    needs: [frontend, apple-check]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          # Linux arm64 (Raspberry Pi 5, Ampere, Snapdragon laptops), built natively: Tauri's AppImage tooling
          # only bundles for the machine it runs on. Same Ubuntu as x64, so the same glibc floor.
          - platform: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # yes/no from the `apple-check` job (see docs/SIGNING.md); this job never names a secret
      HAS_APPLE: ${{ needs.apple-check.outputs.has_apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # rust 1.99.1 (its version branch)
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only for the Tauri CLI; no install scripts run.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      # The web UI from the `frontend` job, where tauri.conf.json's frontendDist
      # (app/dist) expects it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: app/dist
      # Turns off beforeBuildCommand (`npm run build`) for this build: the UI is already built.
      - name: Skip the frontend build hook
        shell: bash
        run: echo '{"build":{"beforeBuildCommand":""}}' > "$RUNNER_TEMP/tauri-release.json"
      # Tauri makes its update packages (and their signatures) while bundling, so it needs
      # a key. This one is made here, used here and thrown away; its signatures are discarded.
      - name: Make a throwaway key for the build
        shell: bash
        working-directory: app
        run: npx --no-install tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key"

      # Every platform builds here with no secrets, macOS included: the Apple certificate is
      # never in a job that compiles. With Apple signing on, the `sign-macos` job below signs
      # and notarizes what this builds, and compiles nothing.
      - name: Build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri-release.json -- --locked

      # Windows: the app as a ZIP too, to run from any folder (no installer).
      # PORTABLE.txt tells it to offer the new ZIP instead of installing updates.
      - name: Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable/SketchCraft | Out-Null
          Copy-Item target/release/sketchcraft-app.exe portable/SketchCraft/SketchCraft.exe
          Set-Content portable/SketchCraft/PORTABLE.txt "SketchCraft runs from this folder: unzip anywhere and open SketchCraft.exe. It needs Microsoft Edge WebView2, which Windows 10 and 11 include. When a new version is out, SketchCraft links to the newest portable ZIP."
          New-Item -ItemType Directory -Force extras | Out-Null
          Compress-Archive -Path portable/SketchCraft -DestinationPath "extras/SketchCraft_${v}_x64_portable.zip"
      - name: Keep the portable ZIP for the release
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-portable
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

      # What the release gets: installers, and the update packages (.app.tar.gz,
      # -setup.exe, .AppImage), without the throwaway signatures.
      - name: Collect the installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          p=$(node -p "require('./app/src-tauri/tauri.conf.json').productName")
          # only the file names this platform's bundler makes (name + version); `publish` checks them again
          case "$PLATFORM" in
            macos-latest)   names=("${p}.app.tar.gz" "${p}_universal.app.tar.gz" "${p}_${v}_universal.dmg") ;;
            windows-latest) names=("${p}_${v}_x64-setup.exe" "${p}_${v}_x64_en-US.msi") ;;
            ubuntu-22.04)   names=("${p}_${v}_amd64.AppImage" "${p}_${v}_amd64.deb" "${p}-${v}-1.x86_64.rpm") ;;
            ubuntu-22.04-arm) names=("${p}_${v}_aarch64.AppImage" "${p}_${v}_arm64.deb" "${p}-${v}-1.aarch64.rpm") ;;
            *) echo "::error::unknown platform"; exit 1 ;;
          esac
          for n in "${names[@]}"; do
            find target -path '*/release/bundle/*' -type f -name "$n" -exec cp {} bundles/ \;
          done
          ls -la bundles
          [ -n "$(ls bundles)" ] || { echo "::error::no installers were built"; exit 1; }
      # With Apple signing on, the macOS build waits for `sign-macos` (its signed copy is `bundles-macos-latest`).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true' && 'unsigned-macos' || format('bundles-{0}', matrix.platform) }}
          path: bundles/*
          if-no-files-found: error
          retention-days: 1

  # Apple signing and notarization (only when the Apple secrets exist). It compiles nothing and
  # checks out no code: it takes the unsigned macOS build from the `build` job, and only Apple's
  # own tools (security, codesign, notarytool, stapler, hdiutil) run next to the certificate.
  # The Apple values are given to the steps that use them, one by one, never to the job.
  # NOT YET RUN: watch the first tag with the Apple secrets set (docs/SIGNING.md).
  sign-macos:
    needs: [build, apple-check]
    if: ${{ needs.apple-check.outputs.has_apple == 'true' }}
    runs-on: macos-latest
    # the Apple secrets are Environment secrets: the job waits for the `release` reviewer, like `publish`, and a run
    # started from a branch can't read them. (notarytool --wait has no limit of its own.)
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos
          path: in
      - name: Unpack the app
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          # exactly one update package and one disk image, with plain names: anything else is refused.
          # The names go to later steps as step outputs (never into $GITHUB_ENV or an expression).
          shopt -s nullglob
          tarballs=(in/*.app.tar.gz)
          dmgs=(in/*.dmg)
          [ "${#tarballs[@]}" -eq 1 ] && [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected one .app.tar.gz and one .dmg"; exit 1; }
          tarball=$(basename "${tarballs[0]}")
          dmg=$(basename "${dmgs[0]}")
          re='^[A-Za-z0-9._-]+$'
          [[ $tarball =~ $re ]] && [[ $dmg =~ $re ]] || { echo "::error::unexpected characters in an artifact file name"; exit 1; }
          tar -xzf "in/$tarball" -C work
          apps=(work/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "::error::expected one .app in the macOS update package"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - name: Import the certificate into a temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign, notarize and staple the app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # file names checked in the unpack step (plain characters only), passed as data
          TARBALL_NAME: ${{ steps.unpack.outputs.tarball }}
          DMG_NAME: ${{ steps.unpack.outputs.dmg }}
        run: |
          set -euo pipefail
          app=$(ls -d work/*.app)
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          ditto -c -k --keepParent "$app" work/notarize.zip
          xcrun notarytool submit work/notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          # the update package (signed with the update key later, by `publish`) and a disk image of the stapled app
          tar -czf "out/$TARBALL_NAME" -C work "$(basename "$app")"
          hdiutil create -volname "$(basename "$app" .app)" -srcfolder "$app" -ov -format UDZO "out/$DMG_NAME"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "out/$DMG_NAME"
          xcrun notarytool submit "out/$DMG_NAME" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "out/$DMG_NAME"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-macos-latest
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # Signs the update packages with the real key and makes the draft release. It
  # compiles nothing: the only code that runs with the key is the pinned Tauri
  # CLI's `signer sign` (installed with --ignore-scripts) and a short script
  # below. Put the key in the `release` Environment with required reviewers
  # (docs/SIGNING.md), so a tag alone can't start this job.
  publish:
    needs: [build, sign-macos]
    # sign-macos is skipped when there are no Apple secrets; a failed or cancelled one stops the release
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      # Creates the draft release and uploads to it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only the Tauri CLI, at an exact version, from its own tiny lockfile (sha512 for every file):
      # the key's step doesn't trust the app's whole npm tree. No install scripts run.
      - name: Install only the Tauri CLI (no install scripts)
        working-directory: tools/release
        run: npm ci --ignore-scripts
      # One folder per platform, so a build can only ever supply its own platform's files (no merging).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-macos-latest
          path: bundles/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-windows-latest
          path: bundles/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-ubuntu-22.04
          path: bundles/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-ubuntu-22.04-arm
          path: bundles/linux-arm64
      # Nothing is signed until every platform folder holds exactly its own expected names, and each
      # file is the right kind of file (Mach-O in the macOS app, PE .exe, ELF AppImage, ...).
      - name: Check each platform's files
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          p=$(node -p "require('./app/src-tauri/tauri.conf.json').productName")
          node tools/release/check-bundles.mjs bundles "$p" "$v"
      # Fails the release unless the signing secret is the key this version must be signed with:
      # the OLD key for v0.3.6, the NEW key (the public half in tauri.conf.json) for anything later.
      # It signs a throwaway file and checks it against that public key; nothing else sees the secret.
      - name: Check the signing key matches this release's public key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node tools/release/key-check.mjs . "$PWD/tools/release/node_modules/@tauri-apps/cli/tauri.js"
      - name: Sign the update packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cli="$PWD/tools/release/node_modules/@tauri-apps/cli/tauri.js"
          [ -f "$cli" ] || { echo "::error::the Tauri CLI isn't installed"; exit 1; }
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          for f in $(node -p "Object.values(require('./bundles/manifest.json').update).join(' ')"); do
            node "$cli" signer sign --app-version "$v" "bundles/$f"
          done
      # latest-v2.json: this release (what apps with the NEW public key read). latest.json: what apps
      # that still trust the OLD key read. For v0.3.6 both are this release; for later ones latest.json is the
      # frozen v0.3.6 manifest (tools/release/bridge-latest.json), so an old install goes to 0.3.6 first.
      # Every signature is verified against the expected public key, and a bad or missing bridge file fails.
      - name: latest-v2.json and latest.json
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/make-manifests.mjs . bundles
          cat bundles/latest-v2.json
          cat bundles/latest.json
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(bundles/latest.json bundles/latest-v2.json)
          for f in $(node -p "const m=require('./bundles/manifest.json'); m.upload.concat(Object.values(m.update).map((u) => u + '.sig')).join(' ')"); do files+=("bundles/$f"); done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "SketchCraft $GITHUB_REF_NAME" --notes "Draft: check the files, then publish." "${files[@]}"

  # Build provenance (SLSA, signed through Sigstore) for the files people download: it proves they came
  # from this workflow, at this tag and commit. Check one with `gh attestation verify <file> --repo
  # <owner>/<repo>` (docs/SIGNING.md). Only this job gets `id-token` and `attestations` write; it names no
  # secret, compiles nothing, and attests the artifacts exactly as the build jobs made them.
  attest:
    needs: [publish, cli]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: attest/bundles
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extras-*
          path: attest/extras
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            attest/bundles/*/*.dmg
            attest/bundles/*/*.app.tar.gz
            attest/bundles/*/*.exe
            attest/bundles/*/*.msi
            attest/bundles/*/*.AppImage
            attest/bundles/*/*.deb
            attest/bundles/*/*.rpm
            attest/extras/*/*.zip

  # The headless CLI. No secrets, no write access: it builds and hands the zip on.
  cli:
    needs: [checks, guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: sketchcraft-cli-macos-arm64
            bin: sketchcraft
          - os: ubuntu-22.04
            name: sketchcraft-cli-linux-x64
            bin: sketchcraft
          - os: ubuntu-22.04-arm
            name: sketchcraft-cli-linux-arm64
            bin: sketchcraft
          - os: windows-latest
            name: sketchcraft-cli-windows-x64
            bin: sketchcraft.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # rust 1.99.1 (its version branch)
      - run: cargo build --locked --release -p sketchcraft-core
      - name: Package
        shell: bash
        run: |
          mkdir dist extras
          cp target/release/${{ matrix.bin }} dist/
          cd dist && 7z a ../extras/${{ matrix.name }}.zip ${{ matrix.bin }} >/dev/null || zip ../extras/${{ matrix.name }}.zip ${{ matrix.bin }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras-${{ matrix.name }}
          path: extras/*.zip
          if-no-files-found: error
          retention-days: 1

  # Puts the CLI and portable zips on the draft, then publishes SHA256SUMS.txt
  # for every file on it (so a download can be checked against the release page).
  assets:
    needs: [publish, cli]
    # sign-macos is skipped while Apple signing is off; without this, the skip cascades and the
    # zips and SHA256SUMS never reach the release (it happened on v0.3.6)
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extras-*
          path: extras
          merge-multiple: true
      - name: Add the zips to the draft, then its checksums
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          release() { curl -fsS "${auth[@]}" "${api}/releases?per_page=100" | jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\" and .draft)][0]"; }
          id=$(release | jq -r '.id')
          [ "$id" != "null" ] && [ -n "$id" ] || { echo "::error::No draft release for ${GITHUB_REF_NAME}."; exit 1; }
          upload() {
            curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@$1" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=$(basename "$1")" > /dev/null
          }
          for f in extras/*.zip; do upload "$f"; done
          # every file now on the draft (installers, latest.json, signatures, zips)
          mkdir dl
          release | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" "${api}/releases/assets/${aid}" -o "dl/${name}"
          done
          (cd dl && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          upload SHA256SUMS.txt
