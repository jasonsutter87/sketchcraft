[package]
name = "sketchcraft-core"
version = "0.3.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/jasonsutter87/sketchcraft"
description = "SketchCraft engine: draw outlines, pull them up. Every action is a command."

[lib]
name = "sketchcraft"

[[bin]]
name = "sketchcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
delaunator = "1"
earcutr = "0.4"
flate2 = "1"
font8x8 = "0.3"
geo = "0.33"
glam = { version = "0.30", features = ["serde"] }
pdf-writer = "=0.15.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
skrifa = "=0.42.1"
subsetter = "=0.2.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny_http = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
