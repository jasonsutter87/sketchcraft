[package]
name = "sketchcraft-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jasonsutter87/sketchcraft"
description = "SketchCraft engine: draw outlines, pull them up. Every action is a command."

[lib]
name = "sketchcraft"

[[bin]]
name = "sketchcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
earcutr = "0.4"
font8x8 = "0.3"
geo = "0.30"
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
